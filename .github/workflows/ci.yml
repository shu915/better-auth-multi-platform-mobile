name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Bundles the JavaScript for both platforms. It does not build the native apps (that needs
      # Xcode / the Android SDK), so native build errors and behaviour on a device are not covered.
      - run: npx expo export --platform ios --platform android --output-dir dist
