version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Expo SDK packages move together (npx expo install --fix); better-auth and @better-auth/expo
    # are pinned to the web app's version, so they are raised together with it (see CLAUDE.md).
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
